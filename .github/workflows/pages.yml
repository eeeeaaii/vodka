# Publishes the static build of vodka (server/build.sh --static) to GitHub
# Pages on every push to main. The static build cannot save files; sessions live
# in each visitor's browser storage, the same as any hosted vodka.
#
# Needs a one-time switch in the repo: Settings > Pages > Build and deployment >
# Source: GitHub Actions. The custom domain is set on that same page.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: server/build.sh --quiet --static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: server/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
